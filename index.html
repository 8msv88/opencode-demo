<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenCode Demo</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f1115;
      color: #e8eaed;
    }
    .card {
      text-align: center;
      padding: 2.5rem 3rem;
      border: 1px solid #2a2f3a;
      border-radius: 16px;
      background: #161a22;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    h1 { margin: 0 0 .5rem; font-size: 1.6rem; }
    p { margin: 0 0 1.5rem; color: #9aa4b2; }
    button {
      font: inherit;
      padding: .6rem 1.2rem;
      border-radius: 10px;
      border: 1px solid #3a4150;
      background: #222833;
      color: #e8eaed;
      cursor: pointer;
    }
    button:hover { background: #2b3340; }
    .count { font-weight: 700; color: #7cc4ff; }
  </style>
</head>
<body>
  <div class="card">
    <h1>OpenCode → GitHub demo</h1>
    <p>Proves the browser-driven build-and-push loop works.</p>
    <p>Clicks: <span class="count" id="count">0</span></p>
    <button id="btn">Click me</button>
  </div>
  <script>
    let n = 0;
    const out = document.getElementById('count');
    document.getElementById('btn').addEventListener('click', () => {
      out.textContent = String(++n);
    });
  </script>
</body>
</html>
